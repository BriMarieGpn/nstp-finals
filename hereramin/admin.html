<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrowSauYou | Here-Ramin Admin</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="../css/landing.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .admin-tabs {
            display: flex;
            margin-bottom: 20px;
        }
        .admin-tab {
            padding: 10px 20px;
            background: #f0f0f0;
            border: none;
            cursor: pointer;
            margin-right: 5px;
        }
        .admin-tab.active {
            background: #546b41;
            color: white;
        }
        .admin-section {
            display: none;
        }
        .admin-section.active {
            display: block;
        }
        .tool-item, .request-item {
            border: 1px solid #ddd;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .tool-form, .request-form {
            margin-top: 20px;
        }
        .form-group {
            margin-bottom: 10px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="landing-navbar">
    <div class="landing-nav-left">
        <a href="../index.html" class="brand">
            <img src="../assets/images/main-logo.png" alt="GrowSauYou Logo">
            <span>GrowSauYou</span>
        </a>
        <div class="brand-container">
            <div class="brand-highlight">
                <i class="fas fa-seedling"></i>
                <span>GROW TOOLGETHER</span>
            </div>
            <div class="brand-dropdown">
                <a href="../pages/overview.html" class="side-item"><i class="fas fa-clipboard-list"></i> OVERVIEW</a>
                <a href="../../hereramin/index.html" class="side-item"><i class="fas fa-hand-holding"></i> HERE-RAMIN</a>
                <a href="../pages/receipts/admin.html" class="side-item"><i class="fas fa-receipt"></i> RECEIPTS</a>
            </div>
        </div>
        <div class="landing-links">
            <a href="../index.html">Home</a>
            <a href="../pages/i-tanim/index.html">I-Tanim</a>
            <a href="../pages/overview.html">Here-Ramin</a>
            <a href="../pages/greencommunity/main/index.html">Green Community</a>
        </div>
    </div>

    <div class="nav-right"></div>
    </div>
</nav>

<div class="admin-container">
    <h1>Here-Ramin Admin CMS</h1>
    <div class="admin-tabs">
        <button class="admin-tab active" data-tab="tools">Manage Tools</button>
        <button class="admin-tab" data-tab="requests">Manage Borrow Requests</button>
    </div>

    <div id="tools-section" class="admin-section active">
        <h2>Tools</h2>
        <button id="addToolBtn">Add New Tool</button>
        <div id="toolsList"></div>
        <div id="toolForm" class="tool-form" style="display: none;">
            <h3>Add/Edit Tool</h3>
            <form id="toolFormElement">
                <div class="form-group">
                    <label for="toolName">Name:</label>
                    <input type="text" id="toolName" required>
                </div>
                <div class="form-group">
                    <label for="toolCategory">Category:</label>
                    <select id="toolCategory" required>
                        <option value="Soil Preparation">Soil Preparation</option>
                        <option value="Planting & Propagation">Planting & Propagation</option>
                        <option value="Watering & Irrigation">Watering & Irrigation</option>
                        <option value="Pruning & Maintenance">Pruning & Maintenance</option>
                        <option value="Harvesting">Harvesting</option>
                        <option value="Pest Control">Pest Control</option>
                        <option value="Protective & Safety">Protective & Safety</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="toolImage">Image URL or Base64:</label>
                    <input type="text" id="toolImage" placeholder="Paste image URL or base64 data URL">
                </div>
                <div class="form-group">
                    <label for="toolImageFile">Upload Image:</label>
                    <input type="file" id="toolImageFile" accept="image/*">
                    <img id="toolImagePreview" alt="Preview" style="max-width: 160px; margin-top: 10px; display: none; border: 1px solid #ddd; padding: 5px;" />
                </div>
                <div class="form-group">
                    <label for="toolAvailable">Available:</label>
                    <input type="checkbox" id="toolAvailable" checked>
                </div>
                <button type="submit">Save</button>
                <button type="button" id="cancelToolBtn">Cancel</button>
            </form>
        </div>
    </div>

    <div id="requests-section" class="admin-section">
        <h2>Borrow Requests</h2>
        <div id="requestsList"></div>
    </div>
</div>

<script type="module" src="js/admin.js"></script>
<script type="module" src="../js/navbar-auth.js"></script>
</body>
</html>
