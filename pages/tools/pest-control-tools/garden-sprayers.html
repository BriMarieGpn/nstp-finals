    <script>
        (function() {
            const toolData = {
                'Garden Sprayers': {
                    title: 'Garden Sprayers',
                    description: 'Handheld sprayers used to apply water, organic treatments, and pest-control solutions to plants.',
                    image: '../../../assets/images/garden-sprayers.png'
                },
                'Insect Nets': {
                    title: 'Insect Nets',
                    description: 'Protective mesh nets placed over plants to block insects while still allowing sunlight and airflow.',
                    image: '../../../assets/images/insect-nets.png'
                },
                'Sticky Traps': {
                    title: 'Sticky Traps',
                    description: 'Sticky monitoring cards used to attract and catch flying insects around plants and seedling areas.',
                    image: '../../../assets/images/sticky-traps.png'
                },
                'Hand Dusters': {
                    title: 'Hand Dusters',
                    description: 'Manual applicators used to dust powdered treatments evenly over affected plants and soil.',
                    image: '../../../assets/images/hand-dusters.png'
                }
            };

            const toolTitle = document.getElementById('toolTitle');
            const toolDescription = document.getElementById('toolDescription');
            const toolImage = document.getElementById('toolImage');
            const recommendButtons = document.querySelectorAll('.recommend-item');
            const initialTool = document.body.dataset.initialTool || 'Garden Sprayers';

            function setTool(toolName) {
                const tool = toolData[toolName];
                if (!tool) {
                    return;
                }

                toolTitle.textContent = tool.title;
                toolDescription.textContent = tool.description;
                toolImage.src = tool.image;
                toolImage.alt = tool.title;

                recommendButtons.forEach((button) => {
                    button.classList.toggle('active', button.dataset.tool === toolName);
                });
            }

            recommendButtons.forEach((button) => {
                button.addEventListener('click', () => {
                    setTool(button.dataset.tool);
                });
            });

            setTool(initialTool);
        })();
    </script>
