    <script>
        (function() {
            const toolData = {
                'Gloves': {
                    title: 'Gloves',
                    description: 'Protective gloves that shield hands from dirt, thorns, splinters, and rough gardening surfaces.',
                    image: '../../../assets/images/gloves.png'
                },
                'Aprons': {
                    title: 'Aprons',
                    description: 'Protective aprons that keep clothing clean and provide quick access to small gardening tools.',
                    image: '../../../assets/images/aprons.png'
                },
                'Masks': {
                    title: 'Masks',
                    description: 'Face coverings used to reduce exposure to dust, soil particles, and strong-smelling garden treatments.',
                    image: '../../../assets/images/masks.png'
                },
                'Knee Pads': {
                    title: 'Knee Pads',
                    description: 'Cushioned pads that protect the knees and improve comfort when kneeling for planting or weeding.',
                    image: '../../../assets/images/knee-pads.png'
                }
            };

            const toolTitle = document.getElementById('toolTitle');
            const toolDescription = document.getElementById('toolDescription');
            const toolImage = document.getElementById('toolImage');
            const recommendButtons = document.querySelectorAll('.recommend-item');
            const initialTool = document.body.dataset.initialTool || 'Knee Pads';

            function setTool(toolName) {
                const tool = toolData[toolName];
                if (!tool) {
                    return;
                }

                toolTitle.textContent = tool.title;
                toolDescription.textContent = tool.description;
                toolImage.src = tool.image;
                toolImage.alt = tool.title;

                recommendButtons.forEach((button) => {
                    button.classList.toggle('active', button.dataset.tool === toolName);
                });
            }

            recommendButtons.forEach((button) => {
                button.addEventListener('click', () => {
                    setTool(button.dataset.tool);
                });
            });

            setTool(initialTool);
        })();
    </script>
