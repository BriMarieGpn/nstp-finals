    <script>
        (function() {
            const toolData = {
                'Seed Trays': {
                    title: 'Seed Trays',
                    description: 'Shallow containers with sections used for germinating seeds and growing seedlings.',
                    image: '../../../assets/images/seed-trays.png'
                },
                'Dibbers': {
                    title: 'Dibbers',
                    description: 'A pointed gardening tool used to make holes in the soil for planting seeds, bulbs, or seedlings.',
                    image: '../../../assets/images/dibbers.png'
                },
                'Plant Labels': {
                    title: 'Plant Labels',
                    description: 'Markers used to identify plant names, varieties, or planting dates in the garden.',
                    image: '../../../assets/images/plant-labels.png'
                },
                'Seed Starter Kit': {
                    title: 'Seed Starter Kit',
                    description: 'A gardening kit that contains trays, soil pods, and tools used for starting seeds indoors.',
                    image: '../../../assets/images/seed-starter-kit.png'
                }
            };

            const toolTitle = document.getElementById('toolTitle');
            const toolDescription = document.getElementById('toolDescription');
            const toolImage = document.getElementById('toolImage');
            const recommendButtons = document.querySelectorAll('.recommend-item');
            const initialTool = document.body.dataset.initialTool || 'Dibbers';

            function setTool(toolName) {
                const tool = toolData[toolName];
                if (!tool) {
                    return;
                }

                toolTitle.textContent = tool.title;
                toolDescription.textContent = tool.description;
                toolImage.src = tool.image;
                toolImage.alt = tool.title;

                recommendButtons.forEach((button) => {
                    button.classList.toggle('active', button.dataset.tool === toolName);
                });
            }

            recommendButtons.forEach((button) => {
                button.addEventListener('click', () => {
                    setTool(button.dataset.tool);
                });
            });

            setTool(initialTool);
        })();
    </script>
