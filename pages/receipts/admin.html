<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipts - Admin</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="../../css/receipts.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="receipts-page admin-page">
    <nav class="navbar">
        <div class="nav-left">
            <div class="nav-logo-circle"></div>
            <a class="nav-site-name" href="../../index.html">GrowsauYOU</a>
            <div class="brand-container">
                <div class="brand-highlight">
                    <i class="fas fa-seedling"></i>
                    <span>GROW TOOLGETHER</span>
                </div>
                <div class="brand-dropdown">
                    <a href="../overview.html" class="side-item"><i class="fas fa-clipboard-list"></i> OVERVIEW</a>
                    <a href="../../hereramin/index.html" class="side-item"><i class="fas fa-hand-holding"></i> HERE-RAMIN</a>
                    <a href="admin.html" class="side-item active"><i class="fas fa-receipt"></i> RECEIPTS</a>
                </div>
            </div>
            <ul class="nav-links">
                <li><a href="../greencommunity/index.html" class="active-link">GREEN COMMUNITY</a></li>
                <li><a href="../../i-tanim/user.html" class="active-link">I-TANIM</a></li>
            </ul>
        </div>
        <div class="nav-right">
            <a class="nav-auth-link" href="../i-tanim/login.html">Login</a>
            <a class="nav-auth-link" href="../i-tanim/signup.html">Register</a>
        </div>
    </nav>

    <a class="subpage-back" href="../../index.html">Back</a>

    <main class="receipts-shell">
        <h1 class="receipts-title">Receipts - Admin Panel</h1>
        <div class="receipts-role-switch">
            <a class="role-chip" href="user.html">Go to User View</a>
            <span class="role-chip active">Admin View</span>
        </div>

        <section class="admin-board">
            <article class="admin-card">
                <header class="admin-card-header">
                    <h2>Return Request</h2>
                    <span class="admin-status" id="adminStatus">IN USE</span>
                </header>
                <div class="admin-card-body">
                    <div class="receipt-thumb admin-thumb">
                        <img src="../../assets/images/shovel.png" alt="Shovel">
                    </div>
                    <div class="admin-meta">
                        <h3>Shovel</h3>
                        <p>Requested by: Juan Dela Cruz</p>
                        <p>Qty: 1</p>
                    </div>
                </div>
                <div class="admin-actions">
                    <button type="button" class="status-action admin-btn neutral" id="markPendingBtn">Mark Pending</button>
                    <button type="button" class="status-action admin-btn approve" id="approveBtn">Approve Return</button>
                    <button type="button" class="status-action admin-btn reject" id="rejectBtn">Reject Return</button>
                </div>
                <p class="admin-note" id="adminNote">Current state: in use.</p>
            </article>
        </section>
    </main>

    <script src="../../js/receipts-admin.js"></script>
    <script type="module" src="../../js/navbar-auth.js"></script>
</body>
</html>
