<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="../../css/receipts.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="receipts-page">
    <nav class="navbar">
        <div class="nav-left">
            <div class="nav-logo-circle"></div>
            <span class="nav-site-name">WEBSITE NAME</span>
            <div class="brand-container">
                <div class="brand-highlight">
                    <i class="fas fa-seedling"></i>
                    <span>GROW TOOLGETHER</span>
                </div>
                <div class="brand-dropdown">
    <a href="../../index.html" class="side-item"><i class="fas fa-clipboard-list"></i> OVERVIEW</a>
    <a href="../../hereramin/index.html" class="side-item"><i class="fas fa-hand-holding"></i> HERE-RAMIN</a>
    <a href="user.html" class="side-item active"><i class="fas fa-receipt"></i> RECEIPTS</a>
</div>
            </div>
            <ul class="nav-links">
                <li><a href="../../index.html">GREEN COMMUNITY</a></li>
                <li><a href="../../index.html">I-TANIM</a></li>
            </ul>
        </div>
        <div class="nav-right">
            <span class="welcome-text">Welcome back, Juan!</span>
            <div class="profile-container">
                <i class="fas fa-user-circle profile-icon"></i>
                <div class="dropdown-menu">
                    <a href="#">Profile</a>
                    <a href="#">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <a class="subpage-back" href="../../index.html">Back</a>

    <main class="receipts-shell">
        <h1 class="receipts-title">Borrowing - Page</h1>

        <section class="receipts-card">
            <div class="receipts-tabs">
                <button type="button" class="tab-btn active" data-tab="borrowing">Borrowing</button>
                <button type="button" class="tab-btn" data-tab="returned">Returned</button>
                <button type="button" class="tab-btn" data-tab="borrow-again">Borrow Again</button>
            </div>

            <article class="receipt-item">
                <div class="receipt-tool">
                    <div class="receipt-thumb">
                        <img src="../../assets/images/shovel.png" alt="Shovel">
                    </div>
                    <div class="receipt-meta">
                        <h2>SHOVEL</h2>
                        <p>Brown Metal Shovel</p>
                        <p>Qty: 1</p>
                    </div>
                </div>

                <div class="receipt-status">
                    <div class="tab-panel active" data-panel="borrowing">
                        <h3>IN USE</h3>
                        <button type="button" class="status-action return-btn" id="returnBtn">RETURN <i class="fas fa-angle-right"></i></button>
                    </div>

                    <div class="tab-panel" data-panel="returned">
                        <h3 id="returnedStatusTitle">RETURNED</h3>
                        <div class="status-note" id="returnedStatusNote">Please wait for the admin update</div>
                    </div>

                    <div class="tab-panel" data-panel="borrow-again">
                        <h3 id="borrowAgainTitle">FOR APPROVAL</h3>
                        <div class="status-note" id="borrowAgainNote">Wait for admin's approval</div>
                        <a id="borrowAgainBtn" class="status-action borrow-again-btn disabled" href="#" aria-disabled="true"><i class="fas fa-angle-left"></i> Borrow tool again</a>
                    </div>
                </div>
            </article>
        </section>
    </main>

    <script src="../../js/receipts-user.js"></script>
</body>
</html>
