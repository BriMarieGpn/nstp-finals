<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Not Found</title>

    <style media="screen">
      :root { --p-900:#546B41; --p-600:#99AD7A; --p-300:#DCCCAC; --p-50:#FFF8EC; }
      body { background: var(--p-50); color: var(--p-900); font-family: Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; }
      #message { background: var(--p-300); max-width: 360px; margin: 100px auto 16px; padding: 32px 24px 16px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--p-900) 18%, transparent); }
      #message h3 { color: color-mix(in srgb, var(--p-900) 55%, transparent); font-weight: normal; font-size: 16px; margin: 16px 0 12px; }
      #message h2 { color: var(--p-900); font-weight: 800; font-size: 16px; margin: 0 0 8px; }
      #message h1 { font-size: 22px; font-weight: 600; color: color-mix(in srgb, var(--p-900) 82%, var(--p-50)); margin: 0 0 16px;}
      #message p { line-height: 140%; margin: 16px 0 24px; font-size: 14px; }
      #message a { display: block; text-align: center; background: var(--p-900); text-transform: uppercase; text-decoration: none; color: var(--p-50); padding: 16px; border-radius: 10px; }
      #message, #message a { box-shadow: 0 1px 3px color-mix(in srgb, var(--p-900) 12%, transparent), 0 1px 2px color-mix(in srgb, var(--p-900) 18%, transparent); }
      #load { color: color-mix(in srgb, var(--p-900) 45%, transparent); text-align: center; font-size: 13px; }
      @media (max-width: 600px) {
        body, #message { margin-top: 0; box-shadow: none; }
        body { border-top: 16px solid var(--p-300); }
      }
    </style>
  </head>
  <body>
    <div id="message">
      <h2>404</h2>
      <h1>Page Not Found</h1>
      <p>The specified file was not found on this website. Please check the URL for mistakes and try again.</p>
      <h3>Why am I seeing this?</h3>
      <p>This page was generated by the Firebase Command-Line Interface. To modify it, edit the <code>404.html</code> file in your project's configured <code>public</code> directory.</p>
    </div>
  </body>
</html>
