<head>

<title>GrowsauYOU | Register</title>
<link rel="stylesheet" href="../../css/i-tanim/style.css">
<link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="itanim-page pageRegister">
  <nav class="navbar">
        <div class="nav-left">
            <div class="nav-logo-circle"></div>
            <a class="nav-site-name" href="../../index.html">GrowsauYOU</a>
            <div class="brand-container">
                <div class="brand-highlight">
                    <i class="fas fa-seedling"></i>
                    <span>GROW TOOLGETHER</span>
                </div>
                <div class="brand-dropdown">
                    <a href="../overview.html" class="side-item"><i class="fas fa-clipboard-list"></i> OVERVIEW</a>
                    <a href="../../hereramin/index.html" class="side-item"><i class="fas fa-hand-holding"></i> HERE-RAMIN</a>
                    <a href="../receipts/user.html" class="side-item"><i class="fas fa-receipt"></i> RECEIPTS</a>
                </div>
            </div>
            <ul class="nav-links">
                <li><a href="../greencommunity/index.html">GREEN COMMUNITY</a></li>
                <li><a href="user.html" class="active-link">I-TANIM</a></li>
            </ul>
        </div>
        <div class="nav-right">
            <a class="nav-auth-link" href="login.html">Login</a>
            <a class="nav-auth-link" href="signup.html">Register</a>
        </div>
    </nav>
  <div class="app-shell">
    

    <main class="pageShell">
      <div class="formPage">
        <a class="backLink" href="index.html">
          <span class="arrow">&#8592;</span>
          <span class="miniBrand">GrowsauYOU</span>
        </a>

        <div class="pageTitle">
          <h2>Volunteer Registration</h2>
          <p>Create your account and start volunteering with our barangay programs.</p>
        </div>

        <form class="softPanel formPanel" onsubmit="return false;">
          <div class="fieldRow split21">
            <input type="text" id="fname" placeholder="First Name">
            <input type="text" id="lname" placeholder="Last Name">
          </div>

          <div class="fieldRow">
            <input type="text" id="age" placeholder="Age">
          </div>

          <div class="fieldRow">
            <input type="text" id="address" placeholder="Address">
          </div>

          <div class="fieldRow split11">
            <input type="email" id="email" placeholder="Email Address">
            <input type="password" id="pass" placeholder="Password">
          </div>

          <div class="fieldRow selectWrap">
            <select id="skillCategory">
              <option selected disabled>Select Skill Category</option>
              <option>Urban Gardening</option>
              <option>Community Outreach</option>
              <option>Waste Management</option>
              <option>Construction Support</option>
            </select>
          </div>

          <div class="fieldRow">
            <textarea id="otherSkills" rows="4" placeholder="Other Specific Skills"></textarea>
          </div>

          <div class="fieldRow submitRow">
            <button type="button" class="wideBtn" id="reg-btn">CREATE ACCOUNT</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import {
    getAuth,
    createUserWithEmailAndPassword,
    fetchSignInMethodsForEmail
} from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    setDoc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

import firebaseConfig from "../../js/i-tanim/firebaseConfig.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

async function validateRegistrationRestrictions(age, address) {
    try {
        const adminState = await getDoc(doc(db, 'admin', 'state'));
        if (!adminState.exists()) return { ok: true };
        const restrictions = adminState.data()?.restrictions || {};
        const minAge = Number(restrictions.minAge || 0);
        const validBarangaysRaw = String(restrictions.validBarangays || 'All').trim();
        const validBarangays = validBarangaysRaw.toLowerCase() === 'all'
            ? []
            : validBarangaysRaw.split(',').map((item) => item.trim().toLowerCase()).filter(Boolean);
        const ageNumber = Number(age);
        if (minAge > 0 && ageNumber < minAge) {
            return { ok: false, message: `Registration is restricted to age ${minAge} and above.` };
        }
        if (validBarangays.length > 0) {
            const addressLower = String(address || '').toLowerCase();
            const matchesAnyBarangay = validBarangays.some((barangay) => addressLower.includes(barangay));
            if (!matchesAnyBarangay) {
                return { ok: false, message: `Address is outside allowed barangays: ${validBarangays.join(', ')}` };
            }
        }
        return { ok: true };
    } catch (err) {
        console.warn('Could not validate restrictions, allowing registration fallback', err);
        return { ok: true };
    }
}

document.getElementById("reg-btn").onclick = async () => {
    const email = document.getElementById("email").value.trim();
    const pass = document.getElementById("pass").value;
    const fname = document.getElementById("fname").value.trim();
    const lname = document.getElementById("lname").value.trim();
    const address = document.getElementById("address").value.trim();
    const age = document.getElementById("age").value.trim();
    const skillCategory = document.getElementById("skillCategory").value;
    const otherSkills = document.getElementById("otherSkills").value.trim();

    if (!fname || !lname || !email || !pass || !address || !age || !skillCategory) {
        alert("Please complete all required fields before registering.");
        return;
    }

    if (pass.length < 6) {
        alert("Password must be at least 6 characters.");
        return;
    }

    const restrictionCheck = await validateRegistrationRestrictions(age, address);
    if (!restrictionCheck.ok) {
        alert(restrictionCheck.message);
        return;
    }

    try {
        const existingMethods = await fetchSignInMethodsForEmail(auth, email);
        if (existingMethods && existingMethods.length > 0) {
            if (existingMethods.includes('password')) {
                alert('An account already exists with this email. Please log in or reset your password.');
            } else if (existingMethods.includes('google.com')) {
                alert('This email is already registered with Google sign-in. Please use Google login.');
            } else {
                alert('An account already exists with this email. Please use the existing sign-in method.');
            }
            return;
        }

        const res = await createUserWithEmailAndPassword(auth, email, pass);

        await setDoc(doc(db, "volunteers", res.user.uid), {
            firstName: fname,
            lastName: lname,
            email: email,
            age: age,
            address: address,
            skillCategory: skillCategory,
            otherSkills: otherSkills,
            status: "pending",
            role: "user",
            volunteerID: "ITNM-" + res.user.uid.substring(0, 5).toUpperCase(),
            createdAt: new Date().toISOString(),
            hours: 0,
            enrolledPrograms: [],
            completedPrograms: []
        });

        // Also save to localStorage for local fallback
        const userData = {
            id: res.user.uid,
            firstName: fname,
            lastName: lname,
            email: email,
            age: age,
            address: address,
            skillCategory: skillCategory,
            otherSkills: otherSkills,
            status: "pending",
            volunteerID: "ITNM-" + res.user.uid.substring(0, 5).toUpperCase(),
            role: "user",
            createdAt: new Date().toISOString(),
            hours: 0,
            enrolledPrograms: [],
            completedPrograms: []
        };
        let users = JSON.parse(localStorage.getItem('itanimUsers') || '[]');
        users.push(userData);
        localStorage.setItem('itanimUsers', JSON.stringify(users));

        logSignupEvent('user_signup', email, fname + ' ' + lname);
        window.location.href = "user.html";

    } catch (e) {
        logSignupEvent('signup_failed', email, { error: e.message, code: e.code });
        if (e.code === 'auth/email-already-in-use') {
            alert('That email is already registered. Please use the login page or reset your password.');
        } else if (e.code === 'auth/invalid-email') {
            alert('The email address is invalid. Please enter a valid email.');
        } else {
            alert(`Signup failed: ${e.message}`);
        }
    }
};

function logSignupEvent(actionType, email, nameOrError = {}) {
    try {
        const logEntry = {
            id: `log-${Date.now()}`,
            timestamp: new Date().toISOString(),
            actionType,
            actionDetail: actionType === 'signup_failed' ? `Signup failed: ${nameOrError.error || 'Unknown error'}` : `New volunteer registered: ${typeof nameOrError === 'string' ? nameOrError : ''} (${email})`,
            userId: 'new_user',
            userEmail: email,
            metadata: typeof nameOrError === 'object' ? nameOrError : { name: nameOrError }
        };

        let logs = JSON.parse(localStorage.getItem('itanimAdminLogs') || '[]');
        logs.unshift(logEntry);
        if (logs.length > 10000) logs.pop();
        localStorage.setItem('itanimAdminLogs', JSON.stringify(logs));

        console.log(`[SIGNUP] ${actionType}: ${email}`);
    } catch (err) {
        console.warn('Could not log signup event', err);
    }
}
</script>
    <script type="module" src="../../js/navbar-auth.js"></script>
</body>
</html>
