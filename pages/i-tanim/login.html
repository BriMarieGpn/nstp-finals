<html lang="en">
<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="../../css/i-tanim/style.css">
<link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="itanim-page pageLogin">
  <nav class="navbar">
        <div class="nav-left">

                <div class="brand-dropdown">

                    <a href="../../hereramin/index.html" class="side-item"><i class="fas fa-hand-holding"></i> HERE-RAMIN</a>
                    <a href="../receipts/user.html" class="side-item"><i class="fas fa-receipt"></i> RECEIPTS</a>
                </div>
            </div>
            <ul class="nav-links">
                <li><a href="../../GREEN COMMUNITY/main/index.html">GREEN COMMUNITY</a></li>

    <script type="module" src="../../js/navbar-auth.js"></script>
  <div class="app-shell">
    

    <main class="pageShell">
      <div class="formPage loginLayout">
        <a class="backLink" href="/index.html">
          <span class="arrow">&#8592;</span>
          <span class="miniBrand">GrowsauYOU</span>
        </a>

        <div class="pageTitle compact">
          <h2>Log In</h2>
          <p>Sign in and continue your community service journey.</p>
        </div>

        <div id="authStatusBanner" class="auth-status-banner" style="display:none; padding:16px; margin-bottom:16px; background: rgba(255, 248, 236, 0.12); border: 1px solid rgba(255,248,236,0.25); border-radius: 16px; color: #FFF8EC;">
          <p id="authStatusMessage" style="margin: 0 0 12px 0;"></p>
          <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <button id="continueDashboardBtn" class="btn" style="flex:1; min-width:120px;">Go to Dashboard</button>
            <button id="signOutBtn" class="btn ghostBtn" style="flex:1; min-width:120px;">Sign Out</button>
          </div>
        </div>

        <form id="loginForm" class="softPanel formPanel loginPanel" onsubmit="return false;">
          <div class="fieldRow">
            <input type="email" id="email" placeholder="Email Address">
          </div>
          <div class="fieldRow">
            <input type="password" id="password" placeholder="Password">
          </div>
          <div class="fieldRow">
            <label class="checkboxLabel"><input type="checkbox" id="remember"> Remember me</label>
          </div>

          <div class="fieldRow submitRow">
            <button type="button" class="wideBtn" id="login-btn">LOG IN</button>
          </div>

          <div class="divider">OR</div>

          <button type="button" class="btn-google" id="google-btn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" alt="Google icon">
            Sign in with Google
          </button>
        </form>
      </div>
    </main>
  </div>

  <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import {
    getAuth,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged,
    signOut,
    setPersistence,
    browserLocalPersistence,
    browserSessionPersistence
} from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    collection,
    query,
    where,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

import firebaseConfig from "../../js/i-tanim/firebaseConfig.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();
const authStatusBanner = document.getElementById('authStatusBanner');
const authStatusMessage = document.getElementById('authStatusMessage');
const continueDashboardBtn = document.getElementById('continueDashboardBtn');
const signOutBtn = document.getElementById('signOutBtn');
const loginForm = document.getElementById('loginForm');

function showLoginForm() {
    authStatusBanner.style.display = 'none';
    loginForm.style.display = 'block';
}

async function getVolunteerProfileByUidOrEmail(uid, email) {
    if (uid) {
        const userDoc = await getDoc(doc(db, 'volunteers', uid));
        if (userDoc.exists()) {
            return userDoc;
        }
    }
    if (!email) {
        return null;
    }
    const q = query(collection(db, 'volunteers'), where('email', '==', email));
    const snap = await getDocs(q);
    return snap.docs[0] || null;
}

async function ensureVolunteerProfile(user) {
    const existing = await getVolunteerProfileByUidOrEmail(user.uid, user.email);
    if (existing) {
        return;
    }
    try {
        await setDoc(doc(db, 'volunteers', user.uid), {
            email: user.email || '',
            role: 'user',
            status: 'approved',
            createdAt: new Date().toISOString(),
            hours: 0,
            enrolledPrograms: [],
            completedPrograms: []
        });
    } catch (err) {
        console.warn('Could not create volunteer profile for signed in user', err);
    }
}

function getFriendlyAuthErrorMessage(code) {
    switch (code) {
        case 'auth/invalid-email':
            return 'The email address is not valid. Please check and try again.';
        case 'auth/user-not-found':
            return 'No account was found with that email. Please sign up first or use the correct email.';
        case 'auth/wrong-password':
            return 'The password is incorrect. Please try again or reset your password.';
        case 'auth/too-many-requests':
            return 'Too many login attempts. Please wait a moment and try again.';
        case 'permission-denied':
            return 'Signed in, but your Firestore access was denied. Check Firestore rules/deployment for this project.';
        default:
            return 'Login failed: ' + (code || 'unknown error');
    }
}

function showSignedInBanner(user, role) {
    loginForm.style.display = 'none';
    authStatusBanner.style.display = 'block';
    authStatusMessage.textContent = `You are already signed in as ${user.email}. Redirected to the homepage.`;
    continueDashboardBtn.onclick = () => {
        window.location.href = '../../index.html';
    };
    signOutBtn.onclick = async () => {
        try {
            await signOut(auth);
            window.location.href = 'login.html';
        } catch (e) {
            alert('Could not sign out. Please try again.');
        }
    };
}

async function redirectToDashboard(user) {
    await ensureVolunteerProfile(user);
    window.location.href = '../../index.html';
}

onAuthStateChanged(auth, async (user) => {
    if (user) {
        await ensureVolunteerProfile(user);
        const userDoc = await getVolunteerProfileByUidOrEmail(user.uid, user.email);
        const role = userDoc && userDoc.exists() ? userDoc.data().role || 'user' : 'user';
        showSignedInBanner(user, role);
    } else {
        showLoginForm();
    }
});

document.getElementById("login-btn").onclick = async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const isRemembered = document.getElementById("remember")?.checked;

    if (!email || !password) {
        alert('Please enter both email and password.');
        return;
    }

    try {
        await setPersistence(
            auth,
            isRemembered ? browserLocalPersistence : browserSessionPersistence
        );

        const result = await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        try {
            await redirectToDashboard(result.user);
            logLoginEvent('email_login', email, { remembered: isRemembered });
        } catch (dbError) {
            logLoginEvent('login_failed', email, { error: dbError.message, code: dbError.code || 'unknown' });
            alert(getFriendlyAuthErrorMessage(dbError.code));
        }
    } catch (e) {
        if (e.code === 'auth/user-not-found') {
            alert('No account was found for this email. Please sign up first.');
            return;
        }

        logLoginEvent('login_failed', email, { error: e.message, code: e.code });
        alert(getFriendlyAuthErrorMessage(e.code));
    }
};

document.getElementById("google-btn").onclick = async () => {
    try {
        const result = await signInWithPopup(auth, provider);
        try {
            await redirectToDashboard(result.user);
            logLoginEvent('google_login', result.user.email, true);
        } catch (dbError) {
            logLoginEvent('login_failed', result.user.email || 'google', { error: dbError.message, code: dbError.code || 'unknown' });
            alert(getFriendlyAuthErrorMessage(dbError.code));
        }
    } catch (e) {
        logLoginEvent('login_failed', 'google', { error: e.message });
        alert(getFriendlyAuthErrorMessage(e.code));
    }
};

function logLoginEvent(actionType, email, metadata = {}) {
    try {
        const logEntry = {
            id: `log-${Date.now()}`,
            timestamp: new Date().toISOString(),
            actionType,
            actionDetail: actionType === 'login_failed' ? `Login attempt failed: ${metadata.error || 'Unknown error'}` : `User logged in via ${actionType === 'google_login' ? 'Google' : 'Email'} (${email})`,
            userId: actionType === 'login_failed' ? 'anonymous' : email,
            userEmail: email,
            metadata: typeof metadata === 'object' ? metadata : { remembered: metadata }
        };

        let logs = JSON.parse(localStorage.getItem('itanimAdminLogs') || '[]');
        logs.unshift(logEntry);
        if (logs.length > 10000) logs.pop();
        localStorage.setItem('itanimAdminLogs', JSON.stringify(logs));

        console.log(`[LOGIN] ${actionType}: ${email}`);
    } catch (err) {
        console.warn('Could not log login event', err);
    }
}

</script>

</body>
</html>
