<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I-Tanim | Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="pageLogin">
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brandName">I-TANIM</span>
      </div>
      <div class="topbar-right">
        <span class="hotline">Volunteer Hotline: 0919 096 6996</span>
      </div>
    </header>

    <main class="pageShell">
      <div class="formPage loginLayout">
        <a class="backLink" href="index.html">
          <span class="arrow">&#8592;</span>
          <span class="miniBrand">I-TANIM</span>
        </a>

        <div class="pageTitle compact">
          <h2>Log In</h2>
          <p>Sign in and continue your community service journey.</p>
        </div>

        <form class="softPanel formPanel loginPanel" onsubmit="return false;">
          <div class="fieldRow">
            <input type="email" id="email" placeholder="Email Address">
          </div>
          <div class="fieldRow">
            <input type="password" id="password" placeholder="Password">
          </div>
          <div class="fieldRow submitRow">
            <button type="button" class="wideBtn" id="login-btn">LOG IN</button>
          </div>

          <div class="divider">OR</div>

          <button type="button" class="btn-google" id="google-btn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" alt="Google icon">
            Sign in with Google
          </button>
        </form>
      </div>
    </main>
  </div>

  <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {
    getAuth,
    signInWithEmailAndPassword,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged,
    setPersistence,
    browserLocalPersistence,
    browserSessionPersistence
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyA_WAoRxS0XtSBHO4GKOUPeo9IxSuo9m8E",
    authDomain: "i-tanim.firebaseapp.com",
    projectId: "i-tanim",
    storageBucket: "i-tanim.firebasestorage.app",
    messagingSenderId: "543718035125",
    appId: "1:543718035125:web:92261781c28eec00c738fc"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

onAuthStateChanged(auth, (user) => {
    if (user) window.location.href = "user.html";
});

document.getElementById("login-btn").onclick = async () => {
    const isRemembered = document.getElementById("remember")?.checked;

    try {
        await setPersistence(
            auth,
            isRemembered ? browserLocalPersistence : browserSessionPersistence
        );

        await signInWithEmailAndPassword(
            auth,
            document.getElementById("email").value,
            document.getElementById("password").value
        );
    } catch (e) {
        alert(e.message);
    }
};

document.getElementById("google-btn").onclick = async () => {
    try {
        await signInWithPopup(auth, provider);
    } catch (e) {
        alert(e.message);
    }
};
</script>
</body>
</html>
