<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I-Tanim | Register</title>
<link rel="stylesheet" href="css/style.css">
<header class="topbar">
  <div class="brand">
    <span class="brandName">I-TANIM</span>
  </div>
  <div class="topbar-right">
    <span class="hotline">Volunteer Hotline: 0919 096 6996</span>
  </div>
</header>
</head>
<body class="pageRegister">
  <div class="app-shell">
    

    <main class="pageShell">
      <div class="formPage">
        <a class="backLink" href="index.html">
          <span class="arrow">&#8592;</span>
          <span class="miniBrand">I-TANIM</span>
        </a>

        <div class="pageTitle">
          <h2>Volunteer Registration</h2>
          <p>Create your account and start volunteering with our barangay programs.</p>
        </div>

        <form class="softPanel formPanel" onsubmit="return false;">
          <div class="fieldRow split21">
            <input type="text" id="fname" placeholder="First Name">
            <input type="text" id="lname" placeholder="Last Name">
          </div>

          <div class="fieldRow">
            <input type="text" id="age" placeholder="Age">
          </div>

          <div class="fieldRow">
            <input type="text" id="address" placeholder="Address">
          </div>

          <div class="fieldRow split11">
            <input type="email" id="email" placeholder="Email Address">
            <input type="password" id="pass" placeholder="Password">
          </div>

          <div class="fieldRow selectWrap">
            <select id="skillCategory">
              <option selected disabled>Select Skill Category</option>
              <option>Urban Gardening</option>
              <option>Community Outreach</option>
              <option>Waste Management</option>
              <option>Construction Support</option>
            </select>
          </div>

          <div class="fieldRow">
            <textarea id="otherSkills" rows="4" placeholder="Other Specific Skills"></textarea>
          </div>

          <div class="fieldRow submitRow">
            <button type="button" class="wideBtn" id="reg-btn">CREATE ACCOUNT</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {
    getAuth,
    createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    setDoc
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

import firebaseConfig from "./js/firebaseConfig.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

document.getElementById("reg-btn").onclick = async () => {
    const email = document.getElementById("email").value;
    const pass = document.getElementById("pass").value;
    const fname = document.getElementById("fname").value;
    const lname = document.getElementById("lname").value;
    const address = document.getElementById("address").value;
    const age = document.getElementById("age").value;
    const skillCategory = document.getElementById("skillCategory").value;
    const otherSkills = document.getElementById("otherSkills").value;

    if (pass.length < 6) {
        alert("Password must be at least 6 characters.");
        return;
    }

    try {
        const res = await createUserWithEmailAndPassword(auth, email, pass);

        await setDoc(doc(db, "volunteers", res.user.uid), {
            firstName: fname,
            lastName: lname,
            email: email,
            age: age,
            address: address,
            skillCategory: skillCategory,
            otherSkills: otherSkills,
            status: "Pending",
            volunteerID: "ITNM-" + res.user.uid.substring(0, 5).toUpperCase()
        });

        // Also save to localStorage for local fallback
        const userData = {
            id: res.user.uid,
            firstName: fname,
            lastName: lname,
            email: email,
            age: age,
            address: address,
            skillCategory: skillCategory,
            otherSkills: otherSkills,
            status: "Pending",
            volunteerID: "ITNM-" + res.user.uid.substring(0, 5).toUpperCase(),
            role: "user"
        };
        let users = JSON.parse(localStorage.getItem('itanimUsers') || '[]');
        users.push(userData);
        localStorage.setItem('itanimUsers', JSON.stringify(users));

        window.location.href = "user.html";

    } catch (e) {
        alert("Firebase not configured. Using local storage instead.");
        // Fallback to localStorage
        const userId = "user" + Date.now();
        const userData = {
            id: userId,
            firstName: fname,
            lastName: lname,
            email: email,
            age: age,
            address: address,
            skillCategory: skillCategory,
            otherSkills: otherSkills,
            status: "Pending",
            volunteerID: "ITNM-" + userId.substring(4, 9).toUpperCase(),
            role: "user"
        };
        let users = JSON.parse(localStorage.getItem('itanimUsers') || '[]');
        users.push(userData);
        localStorage.setItem('itanimUsers', JSON.stringify(users));
        window.location.href = "user.html";
    }
};
</script>
</body>
</html>
