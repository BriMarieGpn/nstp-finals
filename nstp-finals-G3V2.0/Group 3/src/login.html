<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I-Tanim | Login</title>
<link rel="stylesheet" href="css/style.css">
<header class="topbar">
  <div class="brand">
    <span class="brandName">I-TANIM</span>
  </div>
  <div class="topbar-right">
    <span class="hotline">Volunteer Hotline: 0919 096 6996</span>
  </div>
</header>
</head>
<body class="pageLogin">
  <div class="app-shell">
    

    <main class="pageShell">
      <div class="formPage loginLayout">
        <a class="backLink" href="index.html">
          <span class="arrow">&#8592;</span>
          <span class="miniBrand">I-TANIM</span>
        </a>

        <div class="pageTitle compact">
          <h2>Log In</h2>
          <p>Sign in and continue your community service journey.</p>
        </div>

        <div id="authStatusBanner" class="auth-status-banner" style="display:none; padding:16px; margin-bottom:16px; background: rgba(255, 248, 236, 0.12); border: 1px solid rgba(255,248,236,0.25); border-radius: 16px; color: #FFF8EC;">
          <p id="authStatusMessage" style="margin: 0 0 12px 0;"></p>
          <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <button id="continueDashboardBtn" class="btn" style="flex:1; min-width:120px;">Go to Dashboard</button>
            <button id="signOutBtn" class="btn ghostBtn" style="flex:1; min-width:120px;">Sign Out</button>
          </div>
        </div>

        <form id="loginForm" class="softPanel formPanel loginPanel" onsubmit="return false;">
          <div class="fieldRow">
            <input type="email" id="email" placeholder="Email Address">
          </div>
          <div class="fieldRow">
            <input type="password" id="password" placeholder="Password">
          </div>
          <div class="fieldRow">
            <label class="checkboxLabel"><input type="checkbox" id="remember"> Remember me</label>
          </div>

          <div class="fieldRow submitRow">
            <button type="button" class="wideBtn" id="login-btn">LOG IN</button>
          </div>

          <div class="divider">OR</div>

          <button type="button" class="btn-google" id="google-btn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" alt="Google icon">
            Sign in with Google
          </button>
        </form>
      </div>
    </main>
  </div>

  <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {
    getAuth,
    signInWithEmailAndPassword,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged,
    signOut,
    setPersistence,
    browserLocalPersistence,
    browserSessionPersistence
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    collection,
    query,
    where,
    getDocs
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

import firebaseConfig from "./js/firebaseConfig.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();
const authStatusBanner = document.getElementById('authStatusBanner');
const authStatusMessage = document.getElementById('authStatusMessage');
const continueDashboardBtn = document.getElementById('continueDashboardBtn');
const signOutBtn = document.getElementById('signOutBtn');
const loginForm = document.getElementById('loginForm');

function showLoginForm() {
    authStatusBanner.style.display = 'none';
    loginForm.style.display = 'block';
}

async function getVolunteerProfileByUidOrEmail(uid, email) {
    const userDoc = await getDoc(doc(db, 'volunteers', uid));
    if (userDoc.exists()) {
        return userDoc;
    }
    if (!email) {
        return null;
    }
    const q = query(collection(db, 'volunteers'), where('email', '==', email));
    const snap = await getDocs(q);
    return snap.docs[0] || null;
}

function showSignedInBanner(user, role) {
    loginForm.style.display = 'none';
    authStatusBanner.style.display = 'block';
    authStatusMessage.textContent = `You are already signed in as ${user.email}. Redirected to your ${role === 'admin' ? 'admin' : 'user'} dashboard.`;
    continueDashboardBtn.onclick = () => {
        window.location.href = role === 'admin' ? 'admin.html' : 'user.html';
    };
    signOutBtn.onclick = async () => {
        try {
            await signOut(auth);
            window.location.reload();
        } catch (e) {
            alert('Could not sign out. Please try again.');
        }
    };
}

onAuthStateChanged(auth, async (user) => {
    if (user) {
        const userDoc = await getVolunteerProfileByUidOrEmail(user.uid, user.email);
        const role = userDoc && userDoc.exists() ? userDoc.data().role || 'user' : 'user';
        showSignedInBanner(user, role);
    } else {
        showLoginForm();
    }
});

document.getElementById("login-btn").onclick = async () => {
    const isRemembered = document.getElementById("remember")?.checked;

    try {
        await setPersistence(
            auth,
            isRemembered ? browserLocalPersistence : browserSessionPersistence
        );

        await signInWithEmailAndPassword(
            auth,
            document.getElementById("email").value,
            document.getElementById("password").value
        );
    } catch (e) {
        alert(e.message);
    }
};

document.getElementById("google-btn").onclick = async () => {
    try {
        await signInWithPopup(auth, provider);
    } catch (e) {
        alert(e.message);
    }
};
</script>
</body>
</html>
