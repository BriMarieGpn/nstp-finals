<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Green Community</title>

  <link rel="stylesheet" href="../css/reusable.css">
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/index.css">
  <link rel="stylesheet" href="../css/plant.css">
</head>

<body>
  <header>
    <nav class="web-pages">
      <h3>Green Community</h3>
      <ul>
        <li><a href="/" >I-Tanim</a></li>
        <li><a href="/">Here-Ramin</a></li>
      </ul>
    </nav>

    <nav class="register-buttons">
      <button id="log-in">Login</a></button>
      <button id="sign-up">Sign-Up</a></button>
    </nav>
  </header>
  
  <main class="bg">
    <section class="welcome-section">
      <div class="welcome-text">
        <h1>Welcome to Green Community</h1>
        <p>Your Guide to Local Planting</p>
      </div>
    </section>

    <div class="gif">
      <div class="text">
        <h4>What plant are you looking for today?</h4>
      </div>

      <section id="category-menu">
        <div class="category-button" onclick="filterPlants('Herbs')">
          <img src="..../assets/images/herbs.png" alt="this is an image of herbs">
        </div>
        <div class="category-button" onclick="filterPlants('Fruits')">
            <img src="..../assets/images/fruits.png" alt="this is an image of fruits">
        </div>
        <div class="category-button" onclick="filterPlants('Vegetables')">
            <img src="..../assets/images/vegetables.png" alt="this is an image of vegetables">
        </div>
      </section>
    </div>


    <div id="plant-grid" style="display:none;">
      <div class="grid-header">
          <button onclick="showMenu()" class="back-button">← Back to Categories</button>

          <div class="search-wrapper">
              <input type="text" id="live-search" placeholder="Live search by name or scientific name...">
              <div id="suggestions-dropdown" class="suggestions-dropdown"></div>
          </div>

          <button id="filter-btn" class="filter-btn">Filter ▼</button>
      </div>
      <div id="grid-container"></div>
    </div>


    <!-- BACK BUTTON -->
    <div id="plant-detail" style="display:none;">
        <button onclick="showGrid()">← Back to Grid</button>
        <div id="detail-content"></div>
    </div>

    <div id="filter-popup" class="filter-popup" style="display:none;">
        <div class="popup-content">
            <h3>Filter & Sort</h3>

            <div class="filter-section">
                <label>Lifespan:</label>
                <select id="popup-lifespan">
                    <option value="All">All Plants</option>
                </select>
            </div>

            <div class="filter-section">
                <label>Sort by:</label>
                <select id="popup-sort">
                    <option value="name-asc">Name (A-Z)</option>
                    <option value="name-desc">Name (Z-A)</option>
                </select>
            </div>

            <div class="popup-buttons">
                <button onclick="applyFilters()" class="apply-btn">Apply</button>
                <button onclick="closePopup()" class="cancel-btn">Cancel</button>
            </div>
        </div>
    </div>

    <script type="module" src="..../javascript/plant.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.get("category")) {
            document.getElementById("category-menu").style.display = "none";
            document.getElementById("plant-grid").style.display = "block";
        }
    </script>
  </main>
</body>
</html>
