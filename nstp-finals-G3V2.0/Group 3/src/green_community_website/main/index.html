<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Green Community | GrowSauYOU</title>

  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/reusable.css">
  <link rel="stylesheet" href="../css/index.css">
  <link rel="stylesheet" href="../css/plant.css">
</head>

<body>
  <header>
    <nav class="navbar">
      <div class="nav-inner">
        <a href="../../index.html" class="nav-logo">
          <span class="nav-logo__text">GrowSauYOU</span>
        </a>
        <div class="nav-right">
          <div class="nav-links">
            <a href="../../index.html">Home</a>
            <a href="index.html">I-Tanim</a>
            <a href="index.html?category=Herbs">Here-Ramin</a>
          </div>
          <div class="nav-auth">
            <a class="nav-btn nav-btn--ghost" href="../../login.html">Login</a>
            <a class="nav-btn nav-btn--solid" href="../../signup.html">Sign-Up</a>
          </div>
        </div>
      </div>
    </nav>
  </header>
  
  <main class="bg">
    <section class="welcome-section">
      <div class="welcome-text">
        <h1>Welcome to Green Community</h1>
        <p>Your Guide to Local Planting</p>
      </div>
    </section>

    <div class="gif">
      <div class="text">
        <h4>What plant are you looking for today?</h4>
      </div>

      <section id="category-menu">
        <div class="category-button" onclick="filterPlants('Herbs')">
          <img src="../assets/icons/herbs/plantimg_01.png" alt="Herbs category">
          <span class="category-label">Herbs</span>
        </div>
        <div class="category-button" onclick="filterPlants('Fruits')">
            <img src="../assets/icons/fruits/plantimg_26.PNG" alt="Fruits category">
            <span class="category-label">Fruits</span>
        </div>
        <div class="category-button" onclick="filterPlants('Vegetables')">
            <img src="../assets/icons/vegetable/plantimg_48.jfif" alt="Vegetables category">
            <span class="category-label">Vegetables</span>
        </div>
      </section>
    </div>


    <div id="plant-grid" style="display:none;">
      <div class="grid-header">
          <button onclick="showMenu()" class="back-button">← Back to Categories</button>

          <div class="search-wrapper">
              <input type="text" id="live-search" placeholder="Live search by name or scientific name...">
              <div id="suggestions-dropdown" class="suggestions-dropdown"></div>
          </div>

          <button id="filter-btn" class="filter-btn">Filter ▼</button>
      </div>
      <div id="grid-container"></div>
    </div>


    <!-- BACK BUTTON -->
    <div id="plant-detail" style="display:none;">
        <button onclick="showGrid()">← Back to Grid</button>
        <div id="detail-content"></div>
    </div>

    <div id="filter-popup" class="filter-popup" style="display:none;">
        <div class="popup-content">
            <h3>Filter & Sort</h3>

            <div class="filter-section">
                <label>Lifespan:</label>
                <select id="popup-lifespan">
                    <option value="All">All Plants</option>
                </select>
            </div>

            <div class="filter-section">
                <label>Sort by:</label>
                <select id="popup-sort">
                    <option value="name-asc">Name (A-Z)</option>
                    <option value="name-desc">Name (Z-A)</option>
                </select>
            </div>

            <div class="popup-buttons">
                <button onclick="applyFilters()" class="apply-btn">Apply</button>
                <button onclick="closePopup()" class="cancel-btn">Cancel</button>
            </div>
        </div>
    </div>

    <script type="module" src="../javascript/plant.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.get("category")) {
            document.getElementById("category-menu").style.display = "none";
            document.getElementById("plant-grid").style.display = "block";
        }
    </script>
  </main>
</body>
</html>
