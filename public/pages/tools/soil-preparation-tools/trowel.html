    <script src="../../../js/tool-detail-enhancements.js"></script>
    <script>
        (function() {
            const toolData = {
                'Trowel': {
                    title: 'Trowel',
                    description: 'A small hand tool used for digging small holes, planting, transplanting, and loosening soil.',
                    image: '../../../assets/images/trowel.png'
                },
                'Hoe': {
                    title: 'Hoe',
                    description: 'A flat-bladed tool for shaping soil, removing weeds, and creating planting rows.',
                    image: '../../../assets/images/hoe.png'
                },
                'Pitchfork': {
                    title: 'Pitchfork',
                    description: 'A long-handled fork designed to lift, turn, and aerate soil, compost, and mulch.',
                    image: '../../../assets/images/pitchfork.png'
                },
                'Shovel': {
                    title: 'Shovel',
                    description: 'A long-handled scoop-shaped tool used for digging, lifting soil, and moving materials.',
                    image: '../../../assets/images/shovel.png'
                }
            };

            const toolTitle = document.getElementById('toolTitle');
            const toolDescription = document.getElementById('toolDescription');
            const toolImage = document.getElementById('toolImage');
            const recommendButtons = document.querySelectorAll('.recommend-item');
            const initialTool = document.body.dataset.initialTool || 'Trowel';

            function setTool(toolName) {
                const tool = toolData[toolName];
                if (!tool) {
                    return;
                }

                toolTitle.textContent = tool.title;
                toolDescription.textContent = tool.description;
                toolImage.src = tool.image;
                toolImage.alt = tool.title;

                recommendButtons.forEach((button) => {
                    button.classList.toggle('active', button.dataset.tool === toolName);
                });
            }

            recommendButtons.forEach((button) => {
                button.addEventListener('click', () => {
                    setTool(button.dataset.tool);
                });
            });

            setTool(initialTool);
        })();
    </script>
