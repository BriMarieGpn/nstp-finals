<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoe | Soil Preparation Tools</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../style1 (1).css">
    <link rel="stylesheet" href="../style3 (1).css">
</head>
<body class="tool-info-page" data-initial-tool="Hoe">
    <a href="SoilPreparationTools (1).html" class="backbutton"> Back </a>
    <nav class="navbar">
        <div class="nav-left">
            <div class="nav-logo-circle"></div>
            <span>WEBSITE NAME</span>
            <div class="brand-container">
                <div class="brand-highlight">
                    <i class="fas fa-seedling" style="margin-right: 10px; font-size: 24px;"></i>
                    GROW TOOLGETHER
                </div>
            </div>
        </div>
        <div class="nav-right">
            <span>Welcome back, Juan!</span>
            <div class="profile-container">
                <i class="fas fa-user-circle profile-icon"></i>
            </div>
        </div>
    </nav>

    <div class="search-container">
        <div class="search-wrapper">
            <span class="search-icons">⌕</span>
            <input type="text" class="search-bar" placeholder="Search for gardening tools..." />
            <i class="microphone-icon fas fa-microphone"></i>
        </div>
    </div>

    <main class="tools-section tool-info-page">
        <div class="tool-info-layout">
            <section class="preview-panel">
                <div class="preview-card">
                    <img id="toolImage" class="preview-image" src="../images (1)/hoe (1).png" alt="Hoe">
                </div>
            </section>

            <section class="info-panel">
                <div class="info-card">
                    <div class="info-header">
                        <h2>SOIL PREPARATION TOOLS</h2>
                    </div>
                    <button class="floating-action" type="button" aria-label="Tool options">
                        <i class="fas fa-seedling"></i>
                    </button>
                    <div class="info-body">
                        <div class="info-section">
                            <label>Tool Name</label>
                            <h1 id="toolTitle" class="tool-title-large">Hoe</h1>
                        </div>
                        <div class="info-section">
                            <label>Description</label>
                            <p id="toolDescription" class="tool-description">A flat-bladed tool for shaping soil, removing weeds, and creating planting rows.</p>
                        </div>
                        <div class="tool-actions">
                            <button class="tool-action-button" type="button">HERE-RAMIN</button>
                            <button class="tool-action-button" type="button">WIKIHOW?</button>
                        </div>
                    </div>
                </div>
            </section>

            <aside class="recommend-panel">
                <div class="recommend-card">
                    <div class="recommend-header">RECOMMENDED TOOLS</div>
                    <div class="recommend-list" id="recommendList">
                        <button class="recommend-item" data-tool="Trowel" type="button">
                            <div class="recommend-thumb">
                                <img src="../images (1)/trowel (1).png" alt="Trowel">
                            </div>
                            <div class="recommend-details">
                                <span class="recommend-category">Soil Preparation</span>
                                <span class="recommend-name">Trowel</span>
                            </div>
                        </button>
                        <button class="recommend-item active" data-tool="Hoe" type="button">
                            <div class="recommend-thumb">
                                <img src="../images (1)/hoe (1).png" alt="Hoe">
                            </div>
                            <div class="recommend-details">
                                <span class="recommend-category">Soil Preparation</span>
                                <span class="recommend-name">Hoe</span>
                            </div>
                        </button>
                        <button class="recommend-item" data-tool="Pitchfork" type="button">
                            <div class="recommend-thumb">
                                <img src="../images (1)/pitchfork (1).png" alt="Pitchfork">
                            </div>
                            <div class="recommend-details">
                                <span class="recommend-category">Soil Preparation</span>
                                <span class="recommend-name">Pitchfork</span>
                            </div>
                        </button>
                        <button class="recommend-item" data-tool="Shovel" type="button">
                            <div class="recommend-thumb">
                                <img src="../images (1)/shovel (1).png" alt="Shovel">
                            </div>
                            <div class="recommend-details">
                                <span class="recommend-category">Soil Preparation</span>
                                <span class="recommend-name">Shovel</span>
                            </div>
                        </button>
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <script>
        (function() {
            const toolData = {
                Trowel: {
                    title: 'Trowel',
                    description: 'A small hand tool used for digging small holes, planting, transplanting, and loosening soil.',
                    image: '../images (1)/trowel (1).png'
                },
                Hoe: {
                    title: 'Hoe',
                    description: 'A flat-bladed tool for shaping soil, removing weeds, and creating planting rows.',
                    image: '../images (1)/hoe (1).png'
                },
                Pitchfork: {
                    title: 'Pitchfork',
                    description: 'A long-handled fork designed to lift, turn, and aerate soil, compost, and mulch.',
                    image: '../images (1)/pitchfork (1).png'
                },
                Shovel: {
                    title: 'Shovel',
                    description: 'A long-handled scoop-shaped tool used for digging, lifting soil, and moving materials.',
                    image: '../images (1)/shovel (1).png'
                }
            };

            const toolTitle = document.getElementById('toolTitle');
            const toolDescription = document.getElementById('toolDescription');
            const toolImage = document.getElementById('toolImage');
            const recommendButtons = document.querySelectorAll('.recommend-item');
            const initialTool = document.body.dataset.initialTool || 'Hoe';

            function setTool(toolName) {
                const tool = toolData[toolName];
                if (!tool) return;
                toolTitle.textContent = tool.title;
                toolDescription.textContent = tool.description;
                toolImage.src = tool.image;
                toolImage.alt = tool.title;
                recommendButtons.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.tool === toolName);
                });
            }

            recommendButtons.forEach(button => {
                button.addEventListener('click', () => {
                    setTool(button.dataset.tool);
                });
            });

            setTool(initialTool);
        })();
    </script>
</body>
</html>
