<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dibbers | Planting & Propagation Tools</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../style1 (1).css">
    <link rel="stylesheet" href="../style3 (1).css">
</head>
<body class="tool-info-page" data-initial-tool="Dibbers">
    <a href="Planting&PropogationTools (1).html" class="backbutton"> Back </a>
    <nav class="navbar">
        <div class="nav-left">
            <div class="nav-logo-circle"></div>
            <span>WEBSITE NAME</span>
            <div class="brand-container">
                <div class="brand-highlight">
                    <i class="fas fa-seedling" style="margin-right: 10px; font-size: 24px;"></i>
                    GROW TOOLGETHER
                </div>
            </div>
            <ul class="nav-links">
                <li><a href="#">GREEN COMMUNITY</a></li>
                <li><a href="#">I-TANIM</a></li>
            </ul>
        </div>
        <div class="nav-right">
            <span>Welcome back, Juan!</span>
            <div class="profile-container">
                <i class="fas fa-user-circle profile-icon"></i>
            </div>
        </div>
    </nav>

    <div class="search-container">
        <div class="search-wrapper">
            <span class="search-icons">⌕</span>
            <input type="text" class="search-bar" placeholder="Search for gardening tools..." />
            <i class="microphone-icon fas fa-microphone"></i>
        </div>
    </div>

    <main class="tools-section tool-info-page">
        <div class="tool-info-layout">
            <section class="preview-panel">
                <div class="preview-card">
                    <img id="toolImage" class="preview-image" src="../images (1)/dibbers_resized (1).png" alt="Dibbers">
                </div>
            </section>

            <section class="info-panel">
                <div class="info-card">
                    <div class="info-header">
                        <h2>PLANTING & PROPAGATION TOOLS</h2>
                    </div>
                    <button class="floating-action" type="button" aria-label="Tool options">
                        <i class="fas fa-seedling"></i>
                    </button>
                    <div class="info-body">
                        <div class="info-section">
                            <label>Tool Name</label>
                            <h1 id="toolTitle" class="tool-title-large">Dibbers</h1>
                        </div>
                        <div class="info-section">
                            <label>Description</label>
                            <p id="toolDescription" class="tool-description">A pointed gardening tool used to make holes in the soil for planting seeds, bulbs, or seedlings.</p>
                        </div>
                        <div class="tool-actions">
                            <button class="tool-action-button" type="button">HERE-RAMIN</button>
                            <button class="tool-action-button" type="button">WIKIHOW?</button>
                        </div>
                    </div>
                </div>
            </section>

            <aside class="recommend-panel">
                <div class="recommend-card">
                    <div class="recommend-header">RECOMMENDED TOOLS</div>
                    <div class="recommend-list" id="recommendList">
                        <button class="recommend-item active" data-tool="Dibbers" type="button">
                            <div class="recommend-thumb">
                                <img src="../images (1)/dibbers_resized (1).png" alt="Dibbers">
                            </div>
                            <div class="recommend-details">
                                <span class="recommend-category">Planting & Propagation</span>
                                <span class="recommend-name">Dibbers</span>
                            </div>
                        </button>
                        <button class="recommend-item" data-tool="Plant Labels" type="button">
                            <div class="recommend-thumb">
                                <img src="../images (1)/plantlabels_resized (1).png" alt="Plant Labels">
                            </div>
                            <div class="recommend-details">
                                <span class="recommend-category">Planting & Propagation</span>
                                <span class="recommend-name">Plant Labels</span>
                            </div>
                        </button>
                        <button class="recommend-item" data-tool="Seed Starter Kit" type="button">
                            <div class="recommend-thumb">
                                <img src="../images (1)/seedstarterkits_resized (1).png" alt="Seed Starter Kit">
                            </div>
                            <div class="recommend-details">
                                <span class="recommend-category">Planting & Propagation</span>
                                <span class="recommend-name">Seed Starter Kit</span>
                            </div>
                        </button>
                        <button class="recommend-item" data-tool="Seed Trays" type="button">
                            <div class="recommend-thumb">
                                <img src="../images (1)/seedtray1_resized (1).png" alt="Seed Trays">
                            </div>
                            <div class="recommend-details">
                                <span class="recommend-category">Planting & Propagation</span>
                                <span class="recommend-name">Seed Trays</span>
                            </div>
                        </button>
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <script>
        (function() {
            const toolData = {
                'Dibbers': {
                    title: 'Dibbers',
                    description: 'A pointed gardening tool used to make holes in the soil for planting seeds, bulbs, or seedlings.',
                    image: '../images (1)/dibbers_resized (1).png'
                },
                'Plant Labels': {
                    title: 'Plant Labels',
                    description: 'Markers used to identify plant names, varieties, or planting dates in the garden.',
                    image: '../images (1)/plantlabels_resized (1).png'
                },
                'Seed Starter Kit': {
                    title: 'Seed Starter Kit',
                    description: 'A gardening kit that contains trays, soil pods, and tools used for starting seeds indoors.',
                    image: '../images (1)/seedstarterkits_resized (1).png'
                },
                'Seed Trays': {
                    title: 'Seed Trays',
                    description: 'Shallow containers with sections used for germinating seeds and growing seedlings.',
                    image: '../images (1)/seedtray1_resized (1).png'
                }
            };

            const toolTitle = document.getElementById('toolTitle');
            const toolDescription = document.getElementById('toolDescription');
            const toolImage = document.getElementById('toolImage');
            const recommendButtons = document.querySelectorAll('.recommend-item');
            const initialTool = document.body.dataset.initialTool || 'Dibbers';

            function setTool(toolName) {
                const tool = toolData[toolName];
                if (!tool) return;
                toolTitle.textContent = tool.title;
                toolDescription.textContent = tool.description;
                toolImage.src = tool.image;
                toolImage.alt = tool.title;
                recommendButtons.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.tool === toolName);
                });
            }

            recommendButtons.forEach(button => {
                button.addEventListener('click', () => {
                    setTool(button.dataset.tool);
                });
            });

            setTool(initialTool);
        })();
    </script>
</body>
</html>"
