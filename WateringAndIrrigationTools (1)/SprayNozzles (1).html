<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spray Nozzles | Watering & Irrigation Tools</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../style1 (1).css">
    <link rel="stylesheet" href="../style3 (1).css">
</head>
<body class="tool-info-page" data-initial-tool="Spray Nozzles">
    <a href="Watering&IrrigationTools (1).html" class="backbutton"> Back </a>
    <nav class="navbar">
        <div class="nav-left">
            <div class="nav-logo-circle"></div>
            <span>WEBSITE NAME</span>
            <div class="brand-container">
                <div class="brand-highlight">
                    <i class="fas fa-seedling" style="margin-right: 10px; font-size: 24px;"></i>
                    GROW TOOLGETHER
                </div>
            </div>
            <ul class="nav-links">
                <li><a href="#">GREEN COMMUNITY</a></li>
                <li><a href="#">I-TANIM</a></li>
            </ul>
        </div>
        <div class="nav-right">
            <span>Welcome back, Juan!</span>
            <div class="profile-container">
                <i class="fas fa-user-circle profile-icon"></i>
            </div>
        </div>
    </nav>

    <div class="search-container">
        <div class="search-wrapper">
            <span class="search-icons">⌕</span>
            <input type="text" class="search-bar" placeholder="Search for gardening tools..." />
            <i class="microphone-icon fas fa-microphone"></i>
        </div>
    </div>

    <main class="tools-section tool-info-page">
        <div class="tool-info-layout">
            <section class="preview-panel">
                <div class="preview-card">
                    <img id="toolImage" class="preview-image" src="../images (1)/spraynozzles_ (1).png" alt="Spray Nozzles">
                </div>
            </section>

            <section class="info-panel">
                <div class="info-card">
                    <div class="info-header">
                        <h2>WATER AND IRRIGATION TOOLS</h2>
                    </div>
                    <button class="floating-action" type="button" aria-label="Tool options">
                        <i class="fas fa-seedling"></i>
                    </button>
                    <div class="info-body">
                        <div class="info-section">
                            <label>Tool Name</label>
                            <h1 id="toolTitle" class="tool-title-large">Spray Nozzles</h1>
                        </div>
                        <div class="info-section">
                            <label>Description</label>
                            <p id="toolDescription" class="tool-description">An attachment connected to a hose that controls water pressure and spray patterns, allowing precise and efficient watering.</p>
                        </div>
                        <div class="tool-actions">
                            <button class="tool-action-button" type="button">HERE-RAMIN</button>
                            <button class="tool-action-button" type="button">WIKIHOW?</button>
                        </div>
                    </div>
                </div>
            </section>

            <aside class="recommend-panel">
                <div class="recommend-card">
                    <div class="recommend-header">RECOMMENDED TOOLS</div>
                    <div class="recommend-list" id="recommendList">
                        <button class="recommend-item" data-tool="Hose" type="button">
                            <div class="recommend-thumb">
                                <img src="../images (1)/hose (1).png" alt="Hose">
                            </div>
                            <div class="recommend-details">
                                <span class="recommend-category">Water and Irrigation</span>
                                <span class="recommend-name">Hose</span>
                            </div>
                        </button>
                        <button class="recommend-item active" data-tool="Spray Nozzles" type="button">
                            <div class="recommend-thumb">
                                <img src="../images (1)/spraynozzles_ (1).png" alt="Spray Nozzles">
                            </div>
                            <div class="recommend-details">
                                <span class="recommend-category">Water and Irrigation</span>
                                <span class="recommend-name">Spray Nozzles</span>
                            </div>
                        </button>
                        <button class="recommend-item" data-tool="Sprinkler" type="button">
                            <div class="recommend-thumb">
                                <img src="../images (1)/sprinkler (1).png" alt="Sprinkler">
                            </div>
                            <div class="recommend-details">
                                <span class="recommend-category">Water and Irrigation</span>
                                <span class="recommend-name">Sprinkler</span>
                            </div>
                        </button>
                        <button class="recommend-item" data-tool="Watering Can" type="button">
                            <div class="recommend-thumb">
                                <img src="../images (1)/watteringcan (1).png" alt="Watering Can">
                            </div>
                            <div class="recommend-details">
                                <span class="recommend-category">Water and Irrigation</span>
                                <span class="recommend-name">Watering Can</span>
                            </div>
                        </button>
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <script>
        (function() {
            const toolData = {
                Hose: {
                    title: 'Hose',
                    description: 'A flexible tube used to deliver water across the garden for irrigation, cleaning, and general watering tasks.',
                    image: '../images (1)/hose (1).png'
                },
                'Spray Nozzles': {
                    title: 'Spray Nozzles',
                    description: 'An attachment connected to a hose that controls water pressure and spray patterns, allowing precise and efficient watering.',
                    image: '../images (1)/spraynozzles_ (1).png'
                },
                Sprinkler: {
                    title: 'Sprinkler',
                    description: 'A device that distributes water evenly over a wide area, mimicking rainfall and ideal for lawns and large garden spaces.',
                    image: '../images (1)/sprinkler (1).png'
                },
                'Watering Can': {
                    title: 'Watering Can',
                    description: 'A portable container with a handle and spout used for manually watering plants, especially suitable for delicate or indoor plants.',
                    image: '../images (1)/watteringcan (1).png'
                }
            };

            const toolTitle = document.getElementById('toolTitle');
            const toolDescription = document.getElementById('toolDescription');
            const toolImage = document.getElementById('toolImage');
            const recommendButtons = document.querySelectorAll('.recommend-item');
            const initialTool = document.body.dataset.initialTool || 'Spray Nozzles';

            function setTool(toolName) {
                const tool = toolData[toolName];
                if (!tool) return;
                toolTitle.textContent = tool.title;
                toolDescription.textContent = tool.description;
                toolImage.src = tool.image;
                toolImage.alt = tool.title;
                recommendButtons.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.tool === toolName);
                });
            }

            recommendButtons.forEach(button => {
                button.addEventListener('click', () => {
                    setTool(button.dataset.tool);
                });
            });

            setTool(initialTool);
        })();
    </script>
</body>
</html>
