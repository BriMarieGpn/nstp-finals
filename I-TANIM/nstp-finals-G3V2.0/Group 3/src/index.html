<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GrowSauYOU | I-Tanim Redirect</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8f7ee;
      color: #2a3a18;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .container {
      max-width: 420px;
      padding: 24px;
      border: 1px solid rgba(84,107,65,0.18);
      border-radius: 18px;
      background: white;
      box-shadow: 0 18px 40px rgba(0,0,0,0.08);
    }
    a { color: #54704a; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Loading dashboard…</h1>
    <p>If you are not redirected automatically, click <a id="manualLink" href="login.html">here</a>.</p>
  </div>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import firebaseConfig from "./js/firebaseConfig.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const manualLink = document.getElementById('manualLink');
    function goTo(path) {
      manualLink.href = path;
      window.location.href = path;
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        goTo('login.html');
        return;
      }

      try {
        const profileDoc = await getDoc(doc(db, 'volunteers', user.uid));
        const role = profileDoc.exists() ? (profileDoc.data().role || 'user').toLowerCase() : 'user';
        if (role === 'admin') {
          goTo('admin.html');
        } else {
          goTo('user.html');
        }
      } catch (err) {
        console.warn('Could not determine auth role, redirecting to user dashboard', err);
        goTo('user.html');
      }
    });
  </script>
</body>
</html>
