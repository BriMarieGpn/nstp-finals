<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GrowsauYOU | Log In</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-login auth-pending">

  <style>
    .app-shell { opacity: 1; transition: opacity 220ms ease; }
    body.auth-pending .app-shell { opacity: 0; pointer-events: none; }
    #authLoadingGate {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #fff8ec; color: #546b41; z-index: 9999;
      font-weight: 700; letter-spacing: 0.2px;
      opacity: 1; visibility: visible;
      transition: opacity 220ms ease, visibility 220ms ease;
    }
    body:not(.auth-pending) #authLoadingGate { opacity: 0; visibility: hidden; pointer-events: none; }
  </style>

  <div id="authLoadingGate">Checking session…</div>

  <div class="app-shell">
    <!-- Topbar -->
    <header class="topbar">
      <a href="index.html" class="brand-name">
        <img src="assets/SYSTEM-WIDE LOGO.png" alt="" class="brand-logo-img" aria-hidden="true">
        <span class="brand-logo-text">GrowSauYOU</span>
      </a>
      <div style="display:flex;align-items:center;gap:16px;">
        <span class="hotline">BRGY SAUYO HOTLINE: 0919 096 6996</span>
        
      </div>
    </header>

    <main class="form-shell">
      <a href="index.html" class="back-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M19 12H5M5 12l7-7M5 12l7 7" stroke="#546B41" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <img src="assets/SYSTEM-WIDE LOGO.png" alt="" class="back-logo-icon" aria-hidden="true">
        <span class="back-wordmark">GrowSauYOU</span>
      </a>

      <!-- Already signed-in banner -->
      <div id="authStatusBanner" style="display:none;" class="form-card" role="status">
        <p id="authStatusMessage" style="margin:0 0 16px;"></p>
        <div style="display:flex;gap:12px;flex-wrap:wrap;">
          <button id="continueDashboardBtn" class="submit-btn" style="flex:1;min-width:120px;">Go to Dashboard</button>
          <button id="signOutBtn" class="submit-btn ghost-btn" style="flex:1;min-width:120px;">Sign Out</button>
        </div>
      </div>

      <!-- Login form -->
      <div id="loginFormWrap">
        <h1 class="form-title">Log In</h1>
        <p class="form-subtitle">Get notified and stay updated.</p>

        <div class="form-card" id="loginForm">
          <div class="field-row">
            <input type="email" id="email" placeholder="Email Address" required>
          </div>
          <div class="field-row">
            <input type="password" id="password" placeholder="Password" required>
          </div>

          <div class="field-row">
            <button type="button" class="submit-btn" id="login-btn">LOG IN</button>
          </div>

          <div class="divider">OR</div>

          <button type="button" class="google-btn" id="google-btn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" alt="Google icon">
            Sign in with Google
          </button>
        </div>

        <!-- Email-not-found error state -->
        <div id="notFoundCard" class="form-card error-card" style="display:none;">
          <h2 class="error-title">Email not found</h2>
          <p class="error-msg">You have not registered yet. Click to Register.</p>
          <a href="signup.html" class="submit-btn" style="display:block;text-align:center;text-decoration:none;">REGISTER</a>
        </div>

      </div>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      GoogleAuthProvider,
      signInWithPopup,
      onAuthStateChanged,
      signOut,
      setPersistence,
      browserLocalPersistence,
      browserSessionPersistence
    } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
    import {
      getFirestore, doc, getDoc, setDoc,
      collection, query, where, getDocs
    } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";
    import firebaseConfig from "./js/firebaseConfig.js";

    const app      = initializeApp(firebaseConfig);
    const auth     = getAuth(app);
    const db       = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const authStatusBanner   = document.getElementById('authStatusBanner');
    const authStatusMessage  = document.getElementById('authStatusMessage');
    const continueDashboardBtn = document.getElementById('continueDashboardBtn');
    const signOutBtn         = document.getElementById('signOutBtn');
    const loginFormWrap      = document.getElementById('loginFormWrap');
    const notFoundCard       = document.getElementById('notFoundCard');

    const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    const LOCAL_ACCOUNTS = { 'admin@test.local': 'test123', 'user@test.local': 'test123' };

    function normalizeRole(r) { return String(r || 'user').toLowerCase().trim(); }
    function isAdminEmail(e)  { return String(e || '').toLowerCase().includes('admin'); }

    async function getProfile(uid, email) {
      if (isLocal) {
        const users = JSON.parse(localStorage.getItem('itanimUsers') || '[]');
        const u = users.find(x => x.id === uid || x.email === email);
        if (u) return { exists: () => true, data: () => u };
        return null;
      }
      const d = await getDoc(doc(db, 'volunteers', uid));
      if (d.exists()) return d;
      if (!email) return null;
      const q = query(collection(db, 'volunteers'), where('email', '==', email.toLowerCase()));
      const snap = await getDocs(q);
      return snap.empty ? null : snap.docs[0];
    }

    async function ensureProfile(user) {
      if (isLocal) {
        const users = JSON.parse(localStorage.getItem('itanimUsers') || '[]');
        if (!users.find(u => u.email === user.email)) {
          users.push({
            id: user.uid, email: user.email,
            role: isAdminEmail(user.email) ? 'admin' : 'user',
            status: 'approved', createdAt: new Date().toISOString(),
            hours: 0, enrolledPrograms: [], completedPrograms: []
          });
          localStorage.setItem('itanimUsers', JSON.stringify(users));
        }
        return;
      }
      const existing = await getProfile(user.uid, user.email);
      if (!existing) {
        await setDoc(doc(db, 'volunteers', user.uid), {
          email: (user.email || '').toLowerCase(),
          role: isAdminEmail(user.email) ? 'admin' : 'user',
          status: 'approved', createdAt: new Date().toISOString(),
          hours: 0, enrolledPrograms: [], completedPrograms: []
        });
      }
    }

    async function redirectToDashboard(user) {
      await ensureProfile(user);
      const profile = await getProfile(user.uid, user.email);
      const role = profile && profile.exists()
        ? normalizeRole(profile.data().role || (isAdminEmail(user.email) ? 'admin' : 'user'))
        : (isAdminEmail(user.email) ? 'admin' : 'user');
      window.location.href = role === 'admin' ? 'admin.html' : 'user.html';
    }

    function showSignedInBanner(user, role) {
      loginFormWrap.style.display = 'none';
      authStatusBanner.style.display = 'block';
      authStatusMessage.textContent = `You're already signed in as ${user.email}.`;
      continueDashboardBtn.onclick = () => {
        window.location.href = role === 'admin' ? 'admin.html' : 'user.html';
      };
      signOutBtn.onclick = async () => {
        await signOut(auth);
        window.location.reload();
      };
      document.body.classList.remove('auth-pending');
    }

    let resolved = false;
    onAuthStateChanged(auth, async (user) => {
      if (resolved) return;
      resolved = true;
      if (user) {
        await ensureProfile(user);
        const profile = await getProfile(user.uid, user.email);
        const role = profile && profile.exists()
          ? normalizeRole(profile.data().role || (isAdminEmail(user.email) ? 'admin' : 'user'))
          : (isAdminEmail(user.email) ? 'admin' : 'user');
        showSignedInBanner(user, role);
      } else {
        document.body.classList.remove('auth-pending');
      }
    });

    function friendlyError(code) {
      const map = {
        'auth/invalid-email':      'The email address is not valid.',
        'auth/user-not-found':     'No account found with that email.',
        'auth/wrong-password':     'Incorrect password. Please try again.',
        'auth/invalid-credential': 'Invalid credentials. Check your email and password.',
        'auth/too-many-requests':  'Too many attempts. Please wait and try again.',
      };
      return map[code] || 'Login failed. Please try again.';
    }

    document.getElementById('login-btn').onclick = async () => {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      notFoundCard.style.display = 'none';

      if (!email || !password) { alert('Please enter your email and password.'); return; }

      try {
        await setPersistence(auth, browserLocalPersistence);

        let result;
        if (isLocal && LOCAL_ACCOUNTS[email.toLowerCase()]) {
          try {
            result = await signInWithEmailAndPassword(auth, email, password);
          } catch (e) {
            if (e.code === 'auth/user-not-found' || e.code === 'auth/invalid-credential') {
              result = await createUserWithEmailAndPassword(auth, email, password);
            } else throw e;
          }
        } else {
          result = await signInWithEmailAndPassword(auth, email, password);
        }

        await redirectToDashboard(result.user);
      } catch (e) {
        if (e.code === 'auth/user-not-found' || e.code === 'auth/invalid-credential') {
          document.getElementById('loginForm').style.display = 'none';
          notFoundCard.style.display = 'block';
        } else {
          alert(friendlyError(e.code));
        }
      }
    };

    document.getElementById('google-btn').onclick = async () => {
      try {
        const result = await signInWithPopup(auth, provider);
        await redirectToDashboard(result.user);
      } catch (e) {
        alert(friendlyError(e.code));
      }
    };
  </script>
</body>
</html>
