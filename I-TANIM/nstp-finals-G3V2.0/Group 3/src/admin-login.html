<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GrowsauYOU | Admin Login</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ── Admin login exclusive page ── */
    body.page-admin-login {
      min-height: 100vh;
      background: var(--primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Leaf decorations */
    .al-leaf-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .al-leaf-bg svg { position: absolute; opacity: 0.08; }
    .al-leaf-bg .lb-left  { left: -80px; bottom: -60px; width: 380px; }
    .al-leaf-bg .lb-right { right: -80px; top: -60px; width: 340px; transform: rotate(180deg); }

    /* Card */
    .al-card {
      position: relative;
      z-index: 1;
      background: var(--cream);
      border-radius: 24px;
      padding: 40px 36px 32px;
      width: min(420px, 92vw);
      box-shadow:
        0 24px 64px rgba(0,0,0,0.28),
        0 4px 16px rgba(0,0,0,0.14);
    }

    /* Logo */
    .al-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .al-logo img {
      height: 40px;
      width: auto;
      object-fit: contain;
    }
    .al-logo-text {
      font-family: 'Archivo Black', sans-serif;
      font-size: 1.3rem;
      color: var(--primary);
    }

    .al-title {
      font-family: 'Archivo Black', sans-serif;
      font-size: 1.5rem;
      color: var(--primary);
      text-align: center;
      margin: 0 0 4px;
    }
    .al-subtitle {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.82rem;
      color: var(--text-muted);
      text-align: center;
      margin: 0 0 28px;
    }

    /* Fields */
    .al-field {
      margin-bottom: 14px;
    }
    .al-field label {
      display: block;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .al-field input {
      width: 100%;
      border: none;
      border-radius: 10px;
      background: color-mix(in srgb, var(--secondary) 22%, var(--cream));
      padding: 13px 16px;
      color: var(--primary);
      font-family: 'Montserrat', sans-serif;
      font-size: 0.93rem;
      outline: none;
      box-sizing: border-box;
      transition: box-shadow 0.2s;
    }
    .al-field input:focus {
      box-shadow: 0 0 0 2px var(--primary);
    }

    /* Error */
    .al-error {
      background: color-mix(in srgb, #c0392b 12%, var(--cream));
      border: 1px solid #c0392b;
      color: #c0392b;
      border-radius: 10px;
      padding: 10px 14px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.83rem;
      font-weight: 600;
      margin-bottom: 14px;
      display: none;
    }

    /* Button */
    .al-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: var(--cream);
      font-family: 'Archivo Black', sans-serif;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      cursor: pointer;
      margin-top: 6px;
      transition: opacity 0.2s, transform 0.15s;
    }
    .al-btn:hover  { opacity: 0.88; transform: translateY(-1px); }
    .al-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* Back link */
    .al-back {
      position: relative;
      z-index: 1;
      margin-top: 20px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.82rem;
      color: color-mix(in srgb, var(--cream) 70%, transparent);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.2s;
    }
    .al-back:hover { opacity: 0.75; }

    /* Credential hint badge */
    .al-hint {
      background: color-mix(in srgb, var(--secondary) 20%, var(--cream));
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.8rem;
      color: var(--primary);
      line-height: 1.6;
    }
    .al-hint strong { font-weight: 700; }
  </style>
</head>
<body class="page-admin-login">

  <!-- Leaf bg -->
  <div class="al-leaf-bg" aria-hidden="true">
    <svg class="lb-left" viewBox="0 0 300 400" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M60 380 Q-40 200 80 40 Q200 -60 260 100 Q320 260 60 380Z" fill="#FFF8EC"/>
      <path d="M80 360 Q20 220 100 80" stroke="#FFF8EC" stroke-width="8" fill="none"/>
    </svg>
    <svg class="lb-right" viewBox="0 0 300 400" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M60 380 Q-40 200 80 40 Q200 -60 260 100 Q320 260 60 380Z" fill="#FFF8EC"/>
      <path d="M80 360 Q20 220 100 80" stroke="#FFF8EC" stroke-width="8" fill="none"/>
    </svg>
  </div>

  <!-- Login card -->
  <div class="al-card">

    <!-- Logo -->
    <div class="al-logo">
      <img src="assets/SYSTEM-WIDE LOGO.png" alt="" aria-hidden="true">
      <span class="al-logo-text">GrowSauYOU</span>
    </div>

    <h1 class="al-title">Admin Portal</h1>
    <p class="al-subtitle">Restricted access — authorized personnel only</p>

    <!-- Error message -->
    <div class="al-error" id="alError">Invalid credentials. Admin access only.</div>

    <!-- Form -->
    <div class="al-field">
      <label for="alEmail">Email</label>
      <input type="email" id="alEmail" autocomplete="username">
    </div>
    <div class="al-field">
      <label for="alPassword">Password</label>
      <input type="password" id="alPassword" autocomplete="current-password">
    </div>

    <button class="al-btn" id="alLoginBtn">LOG IN AS ADMIN</button>
  </div>

  <!-- Back to home -->
  <a href="index.html" class="al-back">
    ← Back to homepage
  </a>

  <script>
    const ADMIN_EMAIL    = 'admin@test.local';
    const ADMIN_PASSWORD = 'test123';

    const emailEl = document.getElementById('alEmail');
    const passEl  = document.getElementById('alPassword');
    const btnEl   = document.getElementById('alLoginBtn');
    const errorEl = document.getElementById('alError');

    function attempt() {
      errorEl.style.display = 'none';
      const email = emailEl.value.trim().toLowerCase();
      const pass  = passEl.value;

      if (email === ADMIN_EMAIL && pass === ADMIN_PASSWORD) {
        sessionStorage.setItem('adminAuth', 'true');
        window.location.href = 'admin.html';
      } else {
        errorEl.textContent = 'Invalid credentials. Admin access only.';
        errorEl.style.display = 'block';
      }
    }

    btnEl.addEventListener('click', attempt);
    [emailEl, passEl].forEach(el =>
      el.addEventListener('keydown', e => { if (e.key === 'Enter') attempt(); })
    );
  </script>
</body>
</html>
